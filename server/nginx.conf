# 1. HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.rekakarbon.farrelad.com;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Reverse Proxy to NestJS Backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rekakarbon.farrelad.com;

    client_max_body_size 50M;

    # Certbot SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.rekakarbon.farrelad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rekakarbon.farrelad.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}