<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 550" width="100%" height="100%" style="background-color: #f1f5f9;">
  <!-- Phone Screen -->
  <rect x="25" y="25" width="300" height="500" rx="30" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))" />
  
  <!-- App Header -->
  <rect x="25" y="25" width="300" height="80" rx="30" fill="#0ea5e9" />
  <rect x="25" y="65" width="300" height="40" fill="#0ea5e9" />
  <text x="175" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bukti Transfer Berhasil</text>
  
  <!-- Checkmark -->
  <circle cx="175" cy="140" r="35" fill="#10b981" />
  <path d="M155 140 L170 155 L195 125" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Amount -->
  <text x="175" y="210" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">Rp 35.000.000</text>
  <text x="175" y="230" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">14 Jul 2026 • 10:45 WIB</text>
  
  <line x1="50" y1="260" x2="300" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Transfer Details -->
  <text x="50" y="290" font-family="sans-serif" font-size="11" fill="#64748b">Dari Rekening</text>
  <text x="50" y="310" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">PT. BUMI HIJAU SEJAHTERA</text>
  <text x="50" y="330" font-family="monospace" font-size="12" fill="#475569">BCA - 0123****89</text>
  
  <text x="50" y="370" font-family="sans-serif" font-size="11" fill="#64748b">Ke Rekening</text>
  <text x="50" y="390" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">BURSA KARBON INDONESIA</text>
  <text x="50" y="410" font-family="monospace" font-size="12" fill="#475569">Mandiri - 9876****12</text>
  
  <text x="50" y="450" font-family="sans-serif" font-size="11" fill="#64748b">Berita/Catatan</text>
  <text x="50" y="470" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Pembayaran SPE-GRK (125 Unit)</text>
  
  <!-- Share Button -->
  <rect x="50" y="500" width="250" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="175" y="525" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Bagikan Bukti</text>
</svg>
