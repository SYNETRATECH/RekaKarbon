[project]
name = "rekakarbon-ci-notifier"
version = "0.1.0"
description = "Lightweight CI/CD notification engine for RekaKarbon GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RekaKarbon Team" }
]
dependencies = []

[project.scripts]
ci-notifier = "ci_notifier.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
