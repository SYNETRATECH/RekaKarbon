packages:
  - 'client'
  - 'server'
  - 'blockchain'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  keccak: true
  prisma: true
  unrs-resolver: true
  onnxruntime-node: true
  core-js: false
auditConfig: { ignoreGhsas: null }
engineStrict: true
overrides:
  multer: ^2.3.0
  fast-uri: ^3.1.6
  js-yaml: ^4.3.2
  js-yaml@3: ^3.15.2
  adm-zip: ^0.6.0
  deepmerge-ts: ^8.0.0
  mysql2: ^3.22.0
  serialize-javascript: ^7.0.3
  undici: ^6.27.0
  tmp: ^0.2.6
