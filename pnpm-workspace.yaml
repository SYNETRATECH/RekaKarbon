packages:
  - 'client'
  - 'server'
  - 'blockchain'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  keccak: true
  prisma: true
  unrs-resolver: true
  onnxruntime-node: true
  core-js: false
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
engineStrict: true
overrides:
  multer: ^2.3.0
  fast-uri: ^3.1.6
  js-yaml: ^4.3.2
  js-yaml@3: ^3.15.2
  adm-zip: ^0.6.0
  deepmerge-ts: ^8.0.0
  mysql2: ^3.22.0
  serialize-javascript: ^7.0.3
  undici: ^6.27.0
  tmp: ^0.2.6
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  '@modelcontextprotocol/sdk': ^1.32.1
  shell-quote: ^1.12.0
