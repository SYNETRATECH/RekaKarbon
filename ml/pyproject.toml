[project]
name = "rekakarbon-ml"
version = "0.1.0"
description = "AI/ML Carbon Emissions Anomaly Detection Engine for RekaKarbon dMRV"
authors = [
    {name = "Farrel Augusta Dinata", email = "farrel.apeiron@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.19.0",
    "onnx>=1.16.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "joblib>=1.4.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.7.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.0",
    "types-openpyxl>=3.1.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rekakarbon_ml"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*:",
]

