[project]
name = "rekakarbon-ml"
version = "0.1.0"
description = "AI/ML Carbon Emissions Anomaly Detection Engine for RekaKarbon dMRV"
authors = [
    {name = "Farrel Augusta Dinata", email = "farrel.apeiron@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Core Data & Numerics
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.4.0",

    # ML, Modeling & Anomaly Detection
    "scikit-learn>=1.5.0",
    "pyod>=1.1.0",
    "torch>=2.3.0",

    # ONNX Serialization & Runtime
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "skl2onnx>=1.17.0",

    # Visualization, Explainability & Prototyping
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly>=5.24.0",
    "shap (>=0.52.0,<0.53.0)",
    "streamlit>=1.38.0",
]

[project.scripts]
train = "rekakarbon_ml.training.trainer:main"
preprocess = "rekakarbon_ml.data.preprocess:main"
eval = "rekakarbon_ml.evaluation.evaluator:main"
studio = "rekakarbon_ml.studio.cli:main"
pipeline = "rekakarbon_ml.pipeline.orchestrator:main"
benchmark = "rekakarbon_ml.experiments.benchmark:main"
retrain = "rekakarbon_ml.retraining.orchestrator:main"




[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rekakarbon_ml"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*:",
    "ignore::PendingDeprecationWarning:shap.*:",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.0",

    # Linting & Formatting
    "ruff>=0.9.0",

    # Static Typing & Type Stubs
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.0",
    "types-openpyxl>=3.1.0",

    # Security & Vulnerability Auditing
    "pip-audit (>=2.10.1,<3.0.0)",
]
