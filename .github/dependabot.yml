version: 2
updates:
  - package-ecosystem: 'docker'
    directory: '/server'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(docker)'
    labels:
      - 'security'
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(actions)'
    labels:
      - 'ci'
