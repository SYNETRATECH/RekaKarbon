name: Deploy Blockchain Smart Contracts & Hyperledger Besu

on:
  workflow_run:
    workflows: ['Pull Request Verification']
    types:
      - completed
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy-blockchain:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.BLOCKCHAIN_TS_AUTHKEY }}
          tags: tag:ci

      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Clean up heavy local directories
        run: rm -rf blockchain/node_modules blockchain/artifacts blockchain/cache blockchain/typechain-types

      - name: 🧹 Clean up old blockchain folder on Server
        uses: appleboy/ssh-action@master
        env:
          SERVER_PASSWORD: ${{ secrets.BLOCKCHAIN_SSH_PASSWORD }}
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          password: ${{ secrets.BLOCKCHAIN_SSH_PASSWORD }}
          envs: SERVER_PASSWORD
          script: |
            echo "$SERVER_PASSWORD" | sudo -S rm -rf ~/VM_BLOCKHAIN/blockchain

      - name: 🚚 Transfer Files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          password: ${{ secrets.BLOCKCHAIN_SSH_PASSWORD }}
          source: 'blockchain'
          target: '~/VM_BLOCKHAIN'

      - name: 🚀 Execute Deployment on Server
        uses: appleboy/ssh-action@master
        env:
          SERVER_PASSWORD: ${{ secrets.BLOCKCHAIN_SSH_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.BLOCKCHAIN_PRIVATE_KEY }}
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          password: ${{ secrets.BLOCKCHAIN_SSH_PASSWORD }}
          envs: SERVER_PASSWORD,PRIVATE_KEY
          script: |
            set -e

            echo "=== Membersihkan kontainer & data lama (jika ada) ==="
            echo "$SERVER_PASSWORD" | sudo -S docker rm -f besu-dev-node 2>/dev/null || true
            echo "$SERVER_PASSWORD" | sudo -S docker volume rm besu_data 2>/dev/null || true

            echo "=== Menyiapkan Kunci Node (Node Key) ==="
            echo "$SERVER_PASSWORD" | sudo -S mkdir -p ~/VM_BLOCKHAIN/besu_data
            echo "$SERVER_PASSWORD" | sudo -S chmod 777 ~/VM_BLOCKHAIN/besu_data
            echo "8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63" > ~/VM_BLOCKHAIN/besu_data/node_key

            echo "=== Menjalankan Docker Hyperledger Besu ==="
            echo "$SERVER_PASSWORD" | sudo -S docker run -d \
              --name besu-dev-node \
              --restart always \
              -p 8545:8545 \
              -p 8546:8546 \
              -v ~/VM_BLOCKHAIN/besu_data:/opt/besu/data \
              -v ~/VM_BLOCKHAIN/blockchain/besu-config:/config \
              hyperledger/besu:23.4.4 \
              --genesis-file=/config/genesis.json \
              --node-private-key-file=/opt/besu/data/node_key \
              --rpc-http-enabled=true \
              --rpc-http-host=0.0.0.0 \
              --rpc-http-cors-origins="*" \
              --rpc-http-api=ETH,NET,WEB3,DEBUG,MINER,TXPOOL \
              --rpc-ws-enabled=true \
              --rpc-ws-host=0.0.0.0 \
              --host-allowlist="*" \
              --min-gas-price=0 \
              --miner-enabled=true \
              --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73

            echo "=== Menunggu Node Besu siap (max 60 detik) ==="
            for i in $(seq 1 12); do
              if curl -s -X POST --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' http://127.0.0.1:8545 > /dev/null 2>&1; then
                echo "✅ Node Besu sudah merespon pada percobaan ke-$i!"
                break
              fi
              echo "Percobaan ke-$i: Besu belum siap, menunggu 5 detik..."
              sleep 5
              if [ $i -eq 12 ]; then
                echo "❌ Besu gagal menyala setelah 60 detik. Menampilkan log:"
                echo "$SERVER_PASSWORD" | sudo -S docker logs --tail 30 besu-dev-node
                exit 1
              fi
            done

            echo "=== Menginstall dependensi & Deploy Smart Contract ==="
            echo "$SERVER_PASSWORD" | sudo -S docker run --rm \
              -v ~/VM_BLOCKHAIN/blockchain:/app \
              -w /app \
              -e PRIVATE_KEY="$PRIVATE_KEY" \
              --network host \
              node:20 \
              bash -c "npm install && npx hardhat run scripts/deploy.ts --network besu_local"

            echo "✅ DEPLOYMENT SERVER SELESAI!"
