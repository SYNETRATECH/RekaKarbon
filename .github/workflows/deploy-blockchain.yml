name: Deploy QBFT Blockchain

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment yang memiliki approval produksi
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deployment_mode:
        description: Mode verifikasi/configure/deploy kontrak
        required: true
        default: verify-existing
        type: choice
        options:
          - verify-existing
          - configure-existing
          - deploy-new
      allow_deploy_new:
        description: Izinkan deploy kontrak baru setelah approval eksplisit
        required: true
        default: false
        type: boolean
      skip_tests:
        description: 'Bypass smart contract tests and typecheck before packaging'
        required: true
        default: false
        type: boolean
      restart_backend:
        description: Restart backend setelah manifest kontrak tersinkron
        required: true
        default: false
        type: boolean
      carbon_token_address:
        description: '(Opsional) Override alamat kontrak RekaKarbon untuk verify-existing'
        required: false
        default: ''
        type: string
      emission_registry_address:
        description: '(Opsional) Override alamat kontrak EmissionReportRegistry untuk verify-existing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: qbft-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Smart Contracts
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck smart contracts code
        run: pnpm blockchain:typecheck

      - name: Test smart contracts
        run: pnpm blockchain:test

      - name: Audit blockchain dependencies (high)
        run: pnpm audit --prod --audit-level high

  build:
    name: Build Blockchain Artifact
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.bundle_qbft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile smart contracts
        run: pnpm blockchain:compile

      - name: Package immutable QBFT release
        id: bundle_qbft
        run: |
          RELEASE_ID="${{ github.sha }}-${{ github.run_id }}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

          tar \
            --exclude='blockchain/node_modules' \
            --exclude='blockchain/artifacts' \
            --exclude='blockchain/cache' \
            --exclude='blockchain/networks/local-qbft/generated' \
            --exclude='blockchain/.env' \
            --exclude='blockchain/deployment-info.json' \
            --exclude='blockchain/deployment-info-*.json' \
            -czf "qbft-release-${RELEASE_ID}.tar.gz" \
            package.json pnpm-lock.yaml pnpm-workspace.yaml blockchain

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: qbft-release-${{ env.RELEASE_ID }}
          path: qbft-release-${{ env.RELEASE_ID }}.tar.gz
          retention-days: 1

  deploy:
    name: Deploy QBFT to ${{ inputs.environment }}
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT_DIR: ${{ vars.BLOCKCHAIN_PROJECT_DIR || '/home/indah/VM_BLOCKHAIN' }}
      NETWORK_ENV_FILE: ${{ vars.QBFT_NETWORK_ENV_FILE || '/home/indah/VM_BLOCKHAIN/qbft/shared/generated/.env' }}
      BLOCKCHAIN_ENV_FILE: ${{ vars.BLOCKCHAIN_ENV_FILE || '/home/indah/VM_BLOCKHAIN/qbft/shared/.env' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Release ID
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.BLOCKCHAIN_TS_AUTHKEY }}
          tags: tag:ci

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: qbft-release-${{ env.RELEASE_ID }}

      - name: Upload release to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          key: ${{ secrets.BLOCKCHAIN_SSH_PRIVATE_KEY }}
          port: ${{ vars.BLOCKCHAIN_SSH_PORT || '22' }}
          source: qbft-release-${{ env.RELEASE_ID }}.tar.gz
          target: /tmp

      - name: Preflight, start QBFT, deploy contracts, and smoke test
        id: deploy_contracts
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
          NETWORK_ENV_FILE: ${{ env.NETWORK_ENV_FILE }}
          BLOCKCHAIN_ENV_FILE: ${{ env.BLOCKCHAIN_ENV_FILE }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          ALLOW_DEPLOY_NEW: ${{ inputs.allow_deploy_new }}
          BLOCKCHAIN_PRIVATE_KEY: ${{ secrets.BLOCKCHAIN_PRIVATE_KEY }}
          CARBON_TOKEN_ADDRESS_OVERRIDE: ${{ inputs.carbon_token_address }}
          EMISSION_REGISTRY_ADDRESS_OVERRIDE: ${{ inputs.emission_registry_address }}
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          key: ${{ secrets.BLOCKCHAIN_SSH_PRIVATE_KEY }}
          port: ${{ vars.BLOCKCHAIN_SSH_PORT || '22' }}
          envs: RELEASE_ID,PROJECT_DIR,NETWORK_ENV_FILE,BLOCKCHAIN_ENV_FILE,DEPLOYMENT_MODE,ALLOW_DEPLOY_NEW,BLOCKCHAIN_PRIVATE_KEY,CARBON_TOKEN_ADDRESS_OVERRIDE,EMISSION_REGISTRY_ADDRESS_OVERRIDE
          script_stop: true
          script_path: scripts/deploy/blockchain_deploy.sh

      - name: Restart Backend Service on Backend Host
        if: inputs.restart_backend
        uses: appleboy/ssh-action@v1.2.5
        env:
          BACKEND_PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR }}
          BACKEND_SSH_PASSWORD: ${{ secrets.BACKEND_SSH_PASSWORD }}
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          envs: BACKEND_PROJECT_DIR,BACKEND_SSH_PASSWORD
          script_stop: true
          script_path: scripts/deploy/restart_backend.sh
