name: Deploy QBFT Blockchain

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment yang memiliki approval produksi
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deployment_mode:
        description: Mode verifikasi/configure/deploy kontrak
        required: true
        default: verify-existing
        type: choice
        options:
          - verify-existing
          - configure-existing
          - deploy-new
      allow_deploy_new:
        description: Izinkan deploy kontrak baru setelah approval eksplisit
        required: true
        default: false
        type: boolean
      skip_tests:
        description: 'Bypass smart contract tests and typecheck before packaging'
        required: true
        default: false
        type: boolean
      restart_backend:
        description: Restart backend setelah manifest kontrak tersinkron
        required: true
        default: false
        type: boolean
      carbon_token_address:
        description: '(Opsional) Override alamat kontrak RekaKarbon untuk verify-existing'
        required: false
        default: ''
        type: string
      emission_registry_address:
        description: '(Opsional) Override alamat kontrak EmissionReportRegistry untuk verify-existing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: qbft-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Smart Contracts
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck smart contracts code
        run: pnpm blockchain:typecheck

      - name: Test smart contracts
        run: pnpm blockchain:test

      - name: Audit blockchain dependencies (high)
        run: pnpm audit --prod --audit-level high

  build:
    name: Build Blockchain Artifact
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.bundle_qbft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile smart contracts
        run: pnpm blockchain:compile

      - name: Package immutable QBFT release
        id: bundle_qbft
        run: |
          RELEASE_ID="${{ github.sha }}-${{ github.run_id }}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

          tar \
            --exclude='blockchain/node_modules' \
            --exclude='blockchain/artifacts' \
            --exclude='blockchain/cache' \
            --exclude='blockchain/networks/local-qbft/generated' \
            --exclude='blockchain/.env' \
            --exclude='blockchain/deployment-info.json' \
            --exclude='blockchain/deployment-info-*.json' \
            -czf "qbft-release-${RELEASE_ID}.tar.gz" \
            package.json pnpm-lock.yaml pnpm-workspace.yaml blockchain

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbft-release-${{ env.RELEASE_ID }}
          path: qbft-release-${{ env.RELEASE_ID }}.tar.gz
          retention-days: 1

  deploy:
    name: Deploy QBFT to ${{ inputs.environment }}
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT_DIR: ${{ vars.BLOCKCHAIN_PROJECT_DIR || '/home/indah/VM_BLOCKHAIN' }}
      NETWORK_ENV_FILE: ${{ vars.QBFT_NETWORK_ENV_FILE || '/home/indah/VM_BLOCKHAIN/qbft/shared/generated/.env' }}
      BLOCKCHAIN_ENV_FILE: ${{ vars.BLOCKCHAIN_ENV_FILE || '/home/indah/VM_BLOCKHAIN/qbft/shared/.env' }}

    steps:
      - name: Set Release ID
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.BLOCKCHAIN_TS_AUTHKEY }}
          tags: tag:ci

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: qbft-release-${{ env.RELEASE_ID }}

      - name: Upload release to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          key: ${{ secrets.BLOCKCHAIN_SSH_PRIVATE_KEY }}
          port: ${{ vars.BLOCKCHAIN_SSH_PORT || '22' }}
          source: qbft-release-${{ env.RELEASE_ID }}.tar.gz
          target: /tmp

      - name: Preflight, start QBFT, deploy contracts, and smoke test
        id: deploy_contracts
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
          NETWORK_ENV_FILE: ${{ env.NETWORK_ENV_FILE }}
          BLOCKCHAIN_ENV_FILE: ${{ env.BLOCKCHAIN_ENV_FILE }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          ALLOW_DEPLOY_NEW: ${{ inputs.allow_deploy_new }}
          BLOCKCHAIN_PRIVATE_KEY: ${{ secrets.BLOCKCHAIN_PRIVATE_KEY }}
          CARBON_TOKEN_ADDRESS_OVERRIDE: ${{ inputs.carbon_token_address }}
          EMISSION_REGISTRY_ADDRESS_OVERRIDE: ${{ inputs.emission_registry_address }}
        with:
          host: ${{ secrets.BLOCKCHAIN_SSH_HOST }}
          username: ${{ secrets.BLOCKCHAIN_SSH_USERNAME }}
          key: ${{ secrets.BLOCKCHAIN_SSH_PRIVATE_KEY }}
          port: ${{ vars.BLOCKCHAIN_SSH_PORT || '22' }}
          envs: RELEASE_ID,PROJECT_DIR,NETWORK_ENV_FILE,BLOCKCHAIN_ENV_FILE,DEPLOYMENT_MODE,ALLOW_DEPLOY_NEW,BLOCKCHAIN_PRIVATE_KEY,CARBON_TOKEN_ADDRESS_OVERRIDE,EMISSION_REGISTRY_ADDRESS_OVERRIDE
          script_stop: true
          script: |
            set -Eeuo pipefail

            RELEASE_ROOT="$PROJECT_DIR/releases/$RELEASE_ID"
            QBFT_DIR="$RELEASE_ROOT/blockchain"
            QBFT_ARCHIVE="/tmp/qbft-release-${RELEASE_ID}.tar.gz"
            NETWORK_ENV="${NETWORK_ENV_FILE:-$PROJECT_DIR/qbft/shared/generated/.env}"
            BLOCKCHAIN_ENV_SOURCE="${BLOCKCHAIN_ENV_FILE:-$PROJECT_DIR/shared/.env}"
            NETWORK_DIR="$(dirname "$NETWORK_ENV")"

            mkdir -p "$PROJECT_DIR/releases"
            if [ -e "$RELEASE_ROOT" ]; then
              echo "Release target already exists: $RELEASE_ROOT" >&2
              exit 1
            fi
            mkdir -p "$RELEASE_ROOT"
            tar -xzf "$QBFT_ARCHIVE" -C "$RELEASE_ROOT"
            rm -f "$QBFT_ARCHIVE"

            command -v docker >/dev/null 2>&1 || { echo 'Docker tidak tersedia.' >&2; exit 1; }

            # Ensure Docker Compose v2 is available (Compose v1 is incompatible with Docker Engine 26+)
            if ! docker compose version >/dev/null 2>&1; then
              echo 'Docker Compose v2 plugin tidak ditemukan. Mengunduh Compose v2 plugin...'
              mkdir -p "$HOME/.docker/cli-plugins"
              COMPOSE_ARCH="$(uname -m)"
              case "$COMPOSE_ARCH" in
                x86_64) COMPOSE_ARCH="x86_64" ;;
                aarch64) COMPOSE_ARCH="aarch64" ;;
                *) COMPOSE_ARCH="x86_64" ;;
              esac
              curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${COMPOSE_ARCH}" -o "$HOME/.docker/cli-plugins/docker-compose"
              chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            fi

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              echo 'Gagal menginisialisasi Docker Compose v2.' >&2
              exit 1
            fi
            docker version --format '{{.Server.Version}}'
            compose version

            test -r "$NETWORK_ENV" || {
              echo "QBFT generated .env tidak ditemukan: $NETWORK_ENV" >&2
              echo 'Bootstrap QBFT harus dilakukan satu kali secara terpisah; workflow tidak membuat ulang ledger produksi.' >&2
              exit 1
            }
            test -r "$BLOCKCHAIN_ENV_SOURCE" || {
              echo "Environment blockchain tidak ditemukan: $BLOCKCHAIN_ENV_SOURCE" >&2
              exit 1
            }
            test -n "${BLOCKCHAIN_PRIVATE_KEY:-}" || {
              echo 'Secret BLOCKCHAIN_PRIVATE_KEY belum dikonfigurasi.' >&2
              exit 1
            }
            test -f "$NETWORK_DIR/genesis.json" || {
              echo 'genesis.json QBFT tidak ditemukan.' >&2
              exit 1
            }
            test -f "$NETWORK_DIR/nodes/bootnode-1/key" || {
              echo 'Kunci bootnode QBFT tidak ditemukan.' >&2
              exit 1
            }

            # Remove leftover transient/renamed containers from aborted previous runs
            docker ps -a --filter "name=rekakarbon-qbft" --format '{{.ID}} {{.Names}}' | while read -r cid cname; do
              if [[ "$cname" =~ ^[0-9a-f]+_rekakarbon-qbft ]]; then
                echo "Cleaning up leftover transient container: $cname ($cid)"
                docker rm -f "$cid" || true
              fi
            done

            # Compose receives only the generated network environment.
            compose --project-name blockchain --env-file "$NETWORK_ENV" -f "$QBFT_DIR/docker-compose.qbft.yml" config --quiet
            compose --project-name blockchain --env-file "$NETWORK_ENV" -f "$QBFT_DIR/docker-compose.qbft.yml" up -d --remove-orphans

            echo 'Menunggu RPC QBFT dan block progression...'
            for attempt in $(seq 1 30); do
              chain_id="$(curl -fsS --max-time 5 -X POST -H 'content-type: application/json' \
                --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                http://127.0.0.1:8545 | tr -d '\n' || true)"
              if [ -n "$chain_id" ]; then
                break
              fi
              sleep 5
            done
            test -n "${chain_id:-}" || { echo 'RPC QBFT tidak merespons.' >&2; exit 1; }

            block_before="$(curl -fsS --max-time 5 -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":2}' \
              http://127.0.0.1:8545 | tr -d '\n')"
            sleep 8
            block_after="$(curl -fsS --max-time 5 -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":3}' \
              http://127.0.0.1:8545 | tr -d '\n')"
            test "$block_before" != "$block_after" || {
              echo "Block QBFT tidak bertambah: $block_before -> $block_after" >&2
              exit 1
            }

            # Locate existing deployment-info.json across shared, current, or earlier releases
            if [ ! -f "$QBFT_DIR/deployment-info.json" ]; then
              if [ -f "$PROJECT_DIR/shared/deployment-info.json" ]; then
                echo "Reusing existing deployment-info.json from $PROJECT_DIR/shared/deployment-info.json"
                cp "$PROJECT_DIR/shared/deployment-info.json" "$QBFT_DIR/deployment-info.json"
              elif [ -f "$PROJECT_DIR/current/blockchain/deployment-info.json" ]; then
                echo "Reusing existing deployment-info.json from $PROJECT_DIR/current/blockchain/deployment-info.json"
                cp "$PROJECT_DIR/current/blockchain/deployment-info.json" "$QBFT_DIR/deployment-info.json"
              else
                # Search previous release directories in reverse chronological order
                LATEST_PREVIOUS_MANIFEST="$(find "$PROJECT_DIR/releases" -mindepth 3 -maxdepth 3 -name "deployment-info.json" 2>/dev/null | grep -v "$RELEASE_ID" | sort -r | head -n 1 || true)"
                if [ -n "$LATEST_PREVIOUS_MANIFEST" ] && [ -f "$LATEST_PREVIOUS_MANIFEST" ]; then
                  echo "Discovered earlier deployment-info.json at $LATEST_PREVIOUS_MANIFEST"
                  cp "$LATEST_PREVIOUS_MANIFEST" "$QBFT_DIR/deployment-info.json"
                fi
              fi
            fi

            # The deployer key is written only into this release's temporary .env
            # and removed by the EXIT trap after Hardhat finishes.
            cp "$BLOCKCHAIN_ENV_SOURCE" "$QBFT_DIR/.env"
            chmod 600 "$QBFT_DIR/.env"
            printf '\nPRIVATE_KEY=%s\n' "$BLOCKCHAIN_PRIVATE_KEY" >> "$QBFT_DIR/.env"
            printf 'DEPLOYMENT_MODE=%s\n' "$DEPLOYMENT_MODE" >> "$QBFT_DIR/.env"
            printf 'ALLOW_DEPLOY_NEW=%s\n' "$ALLOW_DEPLOY_NEW" >> "$QBFT_DIR/.env"
            printf 'DEPLOYMENT_MANIFEST_PATH=/workspace/blockchain/deployment-info.json\n' >> "$QBFT_DIR/.env"

            if [ -n "${CARBON_TOKEN_ADDRESS_OVERRIDE:-}" ]; then
              printf 'CARBON_TOKEN_CONTRACT_ADDRESS=%s\n' "$CARBON_TOKEN_ADDRESS_OVERRIDE" >> "$QBFT_DIR/.env"
            fi
            if [ -n "${EMISSION_REGISTRY_ADDRESS_OVERRIDE:-}" ]; then
              printf 'EMISSION_REGISTRY_CONTRACT_ADDRESS=%s\n' "$EMISSION_REGISTRY_ADDRESS_OVERRIDE" >> "$QBFT_DIR/.env"
            fi
            trap 'rm -f "$QBFT_DIR/.env"' EXIT

            # Run deployment container
            docker run --rm \
              --network host \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/rekakarbon-home \
              --env COREPACK_HOME=/tmp/rekakarbon-corepack \
              --volume "$RELEASE_ROOT:/workspace" \
              --workdir /workspace \
              node:24.15.0-bookworm \
              bash -Eeuo pipefail -c '
                corepack pnpm --version
                corepack pnpm install --frozen-lockfile --filter ./blockchain... --ignore-scripts
                corepack pnpm --filter ./blockchain qbft:preflight
                corepack pnpm --filter ./blockchain exec hardhat run scripts/deploy.ts --network besu_qbft
              '

            MANIFEST="$QBFT_DIR/deployment-info.json"
            test -s "$MANIFEST" || { echo 'Manifest deployment tidak dibuat.' >&2; exit 1; }
            command -v jq >/dev/null 2>&1 || { echo 'jq diperlukan untuk sinkronisasi manifest.' >&2; exit 1; }
            CARBON_ADDRESS="$(jq -r '.contracts.rekaKarbon.address' "$MANIFEST")"
            REGISTRY_ADDRESS="$(jq -r '.contracts.emissionReportRegistry.address' "$MANIFEST")"
            CHAIN_ID="$(jq -r '.chainId' "$MANIFEST")"
            test "$CARBON_ADDRESS" != 'null' -a "$REGISTRY_ADDRESS" != 'null' || {
              echo 'Alamat kontrak pada manifest tidak lengkap.' >&2
              exit 1
            }

            # Persist manifest to shared so future releases can automatically find existing addresses
            mkdir -p "$PROJECT_DIR/shared"
            cp "$MANIFEST" "$PROJECT_DIR/shared/deployment-info.json"

            echo "QBFT deployment berhasil. Release: $RELEASE_ID"
            echo "Chain ID: $CHAIN_ID"
            echo "RekaKarbon: $CARBON_ADDRESS"
            echo "EmissionReportRegistry: $REGISTRY_ADDRESS"

      - name: Restart Backend Service on Backend Host
        if: inputs.restart_backend
        uses: appleboy/ssh-action@v1.2.5
        env:
          BACKEND_PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR }}
          BACKEND_SSH_PASSWORD: ${{ secrets.BACKEND_SSH_PASSWORD }}
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          envs: BACKEND_PROJECT_DIR,BACKEND_SSH_PASSWORD
          script_stop: true
          script: |
            set -e
            PROJECT_DIR_INPUT="${BACKEND_PROJECT_DIR}"
            PROJECT_DIR=$(eval echo "$PROJECT_DIR_INPUT")

            echo "Target backend host project directory: $PROJECT_DIR"
            echo "Restarting rekakarbon-backend systemd service on backend host..."
            echo "$BACKEND_SSH_PASSWORD" | sudo -S systemctl restart rekakarbon-backend

            echo "Waiting for backend to be healthy..."
            MAX_RETRIES=12
            RETRY_COUNT=0
            HTTP_STATUS="000"

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8006/health || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Backend health check passed (HTTP $HTTP_STATUS)"
                break
              fi
              echo "Backend not ready yet (HTTP $HTTP_STATUS), waiting 5 seconds... ($((RETRY_COUNT+1))/$MAX_RETRIES)"
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT+1))
            done

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Backend health check failed after $((MAX_RETRIES * 5)) seconds (HTTP $HTTP_STATUS)"
              echo "$BACKEND_SSH_PASSWORD" | sudo -S systemctl status rekakarbon-backend --no-pager || true
              exit 1
            fi
