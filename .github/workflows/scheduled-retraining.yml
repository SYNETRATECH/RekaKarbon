name: Scheduled Model Retraining

on:
  schedule:
    # Every Sunday at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force retraining even if no drift detected and schedule not met'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — check triggers but do not swap model artifacts'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.13'

jobs:
  retrain:
    name: Continuous Model Retraining
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install "poetry>=2.0.0,<3.0.0"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate environment
        run: |
          poetry run python -c "import rekakarbon_ml; print('Package import OK')"
          echo "Python: $(poetry run python --version)"

      - name: Run drift detection check
        run: |
          poetry run retrain --dry-run ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.force == true && '--force' || '' }}
        env:
          ML_FEEDBACK_POOL_PATH: data/production/feedback_pool.csv

      - name: Run retraining pipeline
        if: inputs.dry_run != true
        run: |
          poetry run retrain \
            ${{ inputs.force == true && '--force' || '' }}
        env:
          ML_FEEDBACK_POOL_PATH: data/production/feedback_pool.csv

      - name: Run quality verification tests
        run: poetry run pytest -v tests/test_retraining.py tests/test_onnx_parity.py

      - name: Upload updated model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            ml/models/anomaly_pipeline.onnx
            ml/models/anomaly_pipeline.pkl
            ml/models/model_metadata.json
            ml/models/retraining_log.jsonl
          retention-days: 30

      - name: Upload retraining logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-logs-${{ github.run_number }}
          path: ml/models/retraining_log.jsonl
          retention-days: 90
          if-no-files-found: ignore
