name: Pull Request Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Code Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Changed Files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            client:
              - 'client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      # --- CLIENT VERIFICATION ---
      - name: Typecheck client
        if: steps.changes.outputs.client == 'true'
        run: pnpm client:typecheck

      - name: Lint client
        if: steps.changes.outputs.client == 'true'
        run: pnpm client:lint

      - name: Test client (unit & architecture)
        if: steps.changes.outputs.client == 'true'
        run: |
          pnpm --filter ./client test
          pnpm --filter ./client test:arch

      - name: Build client
        if: steps.changes.outputs.client == 'true'
        run: pnpm client:build

      # --- SERVER VERIFICATION ---
      - name: Generate Prisma Client
        if: steps.changes.outputs.server == 'true'
        run: pnpm --filter ./server prisma:generate

      - name: Typecheck server
        if: steps.changes.outputs.server == 'true'
        run: pnpm server:typecheck

      - name: Lint server
        if: steps.changes.outputs.server == 'true'
        run: pnpm server:lint

      - name: Test server
        if: steps.changes.outputs.server == 'true'
        run: pnpm server:test

      - name: Build server
        if: steps.changes.outputs.server == 'true'
        run: pnpm server:build
