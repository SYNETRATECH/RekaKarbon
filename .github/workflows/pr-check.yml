name: Pull Request Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      formatting: ${{ steps.changes.outputs.formatting }}
      client: ${{ steps.changes.outputs.client }}
      server: ${{ steps.changes.outputs.server }}
      contracts: ${{ steps.changes.outputs.contracts }}
      blockchain: ${{ steps.changes.outputs.blockchain }}
      ml: ${{ steps.changes.outputs.ml }}
      ci_notifier: ${{ steps.changes.outputs.ci_notifier }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Changed Files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            formatting:
              - 'client/**'
              - 'server/**'
              - 'blockchain/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr-check.yml'
            client:
              - 'client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr-check.yml'
            server:
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr-check.yml'
            contracts:
              - 'client/src/schemas/**'
              - 'client/src/lib/api.ts'
              - 'client/src/tests/api-contracts.test.ts'
              - 'server/src/**'
              - 'server/test/contracts/**'
              - 'server/test/jest-contracts.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr-check.yml'
            blockchain:
              - 'blockchain/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr-check.yml'
            ml:
              - 'ml/**'
              - '.github/workflows/pr-check.yml'
            ci_notifier:
              - 'scripts/actions/**'
              - '.github/workflows/pr-check.yml'
            dependencies:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'client/package.json'
              - 'server/package.json'
              - 'blockchain/package.json'
              - 'ml/poetry.lock'
              - 'ml/pyproject.toml'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/security-audit.yml'

  format-check:
    name: Code Formatting (Prettier)
    needs: detect-changes
    if: needs.detect-changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

  verify-client:
    name: Verify Client (React Router)
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck client
        run: pnpm client:typecheck

      - name: Lint client
        run: pnpm client:lint

      - name: Test client (unit & architecture)
        run: |
          pnpm --filter ./client test
          pnpm --filter ./client test:arch

      - name: Build client
        run: pnpm client:build

  verify-server:
    name: Verify Server (NestJS)
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: '0xc87509a1c067bbde78beb793e6fa76530b6382a4c0241e5e4a9ec0a0f44dc0d3'
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter ./server prisma:generate

      - name: Typecheck server
        run: pnpm server:typecheck

      - name: Lint server
        run: pnpm server:lint

      - name: Test server
        run: pnpm server:test

      - name: Build server
        run: pnpm server:build

  verify-contracts:
    name: Verify API Contracts (Client <-> Server)
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true' || needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter ./server prisma:generate

      - name: Run API Contract Tests (Server & Client)
        run: pnpm test:contracts

  verify-blockchain:
    name: Verify Blockchain (Hardhat & Smart Contracts)
    needs: detect-changes
    if: needs.detect-changes.outputs.blockchain == 'true'
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: '0xc87509a1c067bbde78beb793e6fa76530b6382a4c0241e5e4a9ec0a0f44dc0d3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck smart contracts code
        run: pnpm blockchain:typecheck

      - name: Compile smart contracts
        run: pnpm blockchain:compile

      - name: Test smart contracts
        run: pnpm blockchain:test

  verify-ml:
    name: Verify ML Engine (Python, Ruff, Mypy & Pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: ml/.venv
          key: venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('ml/poetry.lock') }}

      - name: Install ML dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: ./ml
        run: poetry install --no-interaction

      - name: Check code formatting (Ruff)
        working-directory: ./ml
        run: poetry run ruff format --check .

      - name: Lint ML code (Ruff)
        working-directory: ./ml
        run: poetry run ruff check .

      - name: Typecheck ML code (Mypy)
        working-directory: ./ml
        run: poetry run mypy src tests

      - name: Test ML engine & ONNX parity (Pytest)
        working-directory: ./ml
        run: poetry run pytest -v

  verify-notifier:
    name: Verify CI Notifier (Python & Unittest)
    needs: detect-changes
    if: needs.detect-changes.outputs.ci_notifier == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run CI Notifier unit tests
        run: python3 -m unittest discover -s scripts/actions/ci_notifier/tests

  verify-node-dependencies:
    name: Audit Node.js Dependencies (High & Critical)
    needs: detect-changes
    if: needs.detect-changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Zero High & Critical Node Vulnerabilities
        run: |
          echo "Enforcing zero High and Critical vulnerabilities across monorepo..."
          pnpm audit --audit-level high --ignore-unfixable

  verify-python-dependencies:
    name: Audit Python ML Dependencies
    needs: detect-changes
    if: needs.detect-changes.outputs.dependencies == 'true' || needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install ML dependencies
        working-directory: ./ml
        run: poetry install --no-interaction

      - name: Enforce Zero Python ML Vulnerabilities
        working-directory: ./ml
        run: poetry run pip-audit --skip-editable

  pr-check-complete:
    name: All PR Checks Passed
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - format-check
      - verify-client
      - verify-server
      - verify-contracts
      - verify-blockchain
      - verify-ml
      - verify-notifier
      - verify-node-dependencies
      - verify-python-dependencies
    if: always()
    steps:
      - name: Evaluate Status of All PR Checks
        run: |
          echo "Detect changes result: ${{ needs.detect-changes.result }}"
          echo "Format check result: ${{ needs.format-check.result }}"
          echo "Client verification result: ${{ needs.verify-client.result }}"
          echo "Server verification result: ${{ needs.verify-server.result }}"
          echo "Contracts verification result: ${{ needs.verify-contracts.result }}"
          echo "Blockchain verification result: ${{ needs.verify-blockchain.result }}"
          echo "ML verification result: ${{ needs.verify-ml.result }}"
          echo "CI Notifier verification result: ${{ needs.verify-notifier.result }}"
          echo "Node.js dependency audit result: ${{ needs.verify-node-dependencies.result }}"
          echo "Python ML dependency audit result: ${{ needs.verify-python-dependencies.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more required PR verification jobs failed or were cancelled."
            exit 1
          fi

          echo "✅ All required checks completed successfully or were skipped appropriately."
