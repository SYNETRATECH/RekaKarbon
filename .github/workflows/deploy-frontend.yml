name: Deploy React frontend to GitHub Pages

on:
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Create client .env file
        if: env.FRONTEND_ENV != ''
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          cat > ./client/.env << 'ENVEOF'
          ${{ secrets.FRONTEND_ENV }}
          ENVEOF

      - name: Build
        env:
          BASE_URL: ${{ steps.setup_pages.outputs.base_path }}
        run: |
          echo "Building with BASE_URL=$BASE_URL"
          pnpm run client:build
          cp ./client/build/client/index.html ./client/build/client/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './client/build/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
