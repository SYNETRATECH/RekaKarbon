name: Dependency Security Audit

on:
  schedule:
    # 05:00 AM Jakarta Time (WIB, UTC+7) = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      audit_level:
        description: 'Audit severity threshold for pnpm'
        required: true
        default: 'high'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

permissions:
  contents: read

jobs:
  audit-node:
    name: Audit Node.js Workspace Dependencies
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.pnpm_audit.outputs.status }}
      summary: ${{ steps.pnpm_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Run pnpm audit (Production & Dev)
        id: pnpm_audit
        continue-on-error: true
        run: |
          AUDIT_LEVEL="${{ inputs.audit_level || 'high' }}"
          echo "Running pnpm audit with audit-level: $AUDIT_LEVEL"
          if pnpm audit --audit-level "$AUDIT_LEVEL" > pnpm-audit-report.txt 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "summary=No vulnerabilities found at or above severity '$AUDIT_LEVEL'." >> "$GITHUB_OUTPUT"
          else
            echo "status=issues_detected" >> "$GITHUB_OUTPUT"
            echo "summary=Vulnerabilities detected at or above severity '$AUDIT_LEVEL'." >> "$GITHUB_OUTPUT"
          fi
          cat pnpm-audit-report.txt

      - name: Publish Step Summary
        run: |
          echo "## 🛡️ pnpm Security Audit Report (Severity >= ${{ inputs.audit_level || 'high' }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat pnpm-audit-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Node Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-audit-report
          path: pnpm-audit-report.txt
          retention-days: 7

  audit-python:
    name: Audit Python ML Dependencies
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.pip_audit.outputs.status }}
      summary: ${{ steps.pip_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install ML dependencies (including dev / pip-audit)
        working-directory: ./ml
        run: poetry install --no-interaction

      - name: Run pip-audit on ML project
        id: pip_audit
        working-directory: ./ml
        continue-on-error: true
        run: |
          if poetry run pip-audit > ml-audit-report.txt 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "summary=No known vulnerabilities found in Python ML dependencies." >> "$GITHUB_OUTPUT"
          else
            echo "status=issues_detected" >> "$GITHUB_OUTPUT"
            echo "summary=Known vulnerabilities or audit warnings detected in Python dependencies." >> "$GITHUB_OUTPUT"
          fi
          cat ml-audit-report.txt

      - name: Publish ML Step Summary
        working-directory: ./ml
        run: |
          echo "## 🐍 Python ML Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat ml-audit-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Python ML Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-audit-report
          path: ml/ml-audit-report.txt
          retention-days: 7

  audit-blockchain:
    name: Audit Blockchain & Smart Contracts
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.slither_audit.outputs.status }}
      summary: ${{ steps.slither_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile smart contracts
        run: pnpm blockchain:compile

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Slither Analyzer & solc-select
        run: pip install slither-analyzer solc-select

      - name: Run Slither Security Analysis
        id: slither_audit
        working-directory: ./blockchain
        continue-on-error: true
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24
          if slither . --config-file slither.config.json > slither-report.txt 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "summary=Slither found 0 high/medium severity contract vulnerabilities." >> "$GITHUB_OUTPUT"
          else
            echo "status=issues_detected" >> "$GITHUB_OUTPUT"
            echo "summary=Slither identified security findings or contract issues." >> "$GITHUB_OUTPUT"
          fi
          cat slither-report.txt

      - name: Publish Blockchain Step Summary
        working-directory: ./blockchain
        run: |
          echo "## ⛓️ Smart Contract Static Security Audit (Slither)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat slither-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Blockchain Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockchain-audit-report
          path: blockchain/slither-report.txt
          retention-days: 7

  notify-audit:
    name: Forward Security Audit Results
    runs-on: ubuntu-latest
    needs: [audit-node, audit-python, audit-blockchain]
    if: always()
    steps:
      - name: Consolidate Audit Summary
        id: consolidate
        run: |
          NODE_STATUS="${{ needs.audit-node.outputs.status || 'unknown' }}"
          PY_STATUS="${{ needs.audit-python.outputs.status || 'unknown' }}"
          BC_STATUS="${{ needs.audit-blockchain.outputs.status || 'unknown' }}"

          NODE_SUMMARY="${{ needs.audit-node.outputs.summary || 'Node audit did not complete successfully.' }}"
          PY_SUMMARY="${{ needs.audit-python.outputs.summary || 'Python audit did not complete successfully.' }}"
          BC_SUMMARY="${{ needs.audit-blockchain.outputs.summary || 'Blockchain audit did not complete successfully.' }}"

          # Overall status determination
          if [ "$NODE_STATUS" = "issues_detected" ] || [ "$PY_STATUS" = "issues_detected" ] || [ "$BC_STATUS" = "issues_detected" ]; then
            OVERALL_STATUS="issues_detected"
            OVERALL_TITLE="🚨 Security Audit Warning - Issues Detected"
            DISCORD_COLOR=15158332 # Red
          elif [ "$NODE_STATUS" = "unknown" ] || [ "$PY_STATUS" = "unknown" ] || [ "$BC_STATUS" = "unknown" ]; then
            OVERALL_STATUS="warning"
            OVERALL_TITLE="⚠️ Security Audit Incomplete / Job Error"
            DISCORD_COLOR=16776960 # Yellow
          else
            OVERALL_STATUS="clean"
            OVERALL_TITLE="🛡️ Security Audit Passed - All Clean"
            DISCORD_COLOR=3066993 # Green
          fi

          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "overall_title=$OVERALL_TITLE" >> "$GITHUB_OUTPUT"
          echo "discord_color=$DISCORD_COLOR" >> "$GITHUB_OUTPUT"
          echo "node_status=$NODE_STATUS" >> "$GITHUB_OUTPUT"
          echo "node_summary=$NODE_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "py_status=$PY_STATUS" >> "$GITHUB_OUTPUT"
          echo "py_summary=$PY_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "bc_status=$BC_STATUS" >> "$GITHUB_OUTPUT"
          echo "bc_summary=$BC_SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Send Notification to Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ steps.consolidate.outputs.overall_title }}
          COLOR: ${{ steps.consolidate.outputs.discord_color }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NODE_STATUS: ${{ steps.consolidate.outputs.node_status }}
          NODE_SUMMARY: ${{ steps.consolidate.outputs.node_summary }}
          PY_STATUS: ${{ steps.consolidate.outputs.py_status }}
          PY_SUMMARY: ${{ steps.consolidate.outputs.py_summary }}
          BC_STATUS: ${{ steps.consolidate.outputs.bc_status }}
          BC_SUMMARY: ${{ steps.consolidate.outputs.bc_summary }}
        run: |
          echo "Sending notification to Discord..."
          python3 - << 'EOF'
          import json, os, urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          title = os.environ["TITLE"]
          color = int(os.environ["COLOR"])
          run_url = os.environ["RUN_URL"]

          def status_badge(status):
              if status == "clean":
                  return "✅ Clean"
              elif status == "issues_detected":
                  return "🚨 Vulnerabilities Found"
              return "⚠️ Incomplete / Failed"

          node_text = f"{status_badge(os.environ['NODE_STATUS'])}\n{os.environ['NODE_SUMMARY']}"
          py_text = f"{status_badge(os.environ['PY_STATUS'])}\n{os.environ['PY_SUMMARY']}"
          bc_text = f"{status_badge(os.environ['BC_STATUS'])}\n{os.environ['BC_SUMMARY']}"

          payload = {
              "username": "RekaKarbon Security Bot",
              "embeds": [
                  {
                      "title": title,
                      "url": run_url,
                      "color": color,
                      "description": f"Workflow run: [#{os.environ.get('GITHUB_RUN_ID', 'Run')}]({run_url})\nRepository: `{os.environ.get('GITHUB_REPOSITORY', 'RekaKarbon')}`\nBranch: `{os.environ.get('GITHUB_REF_NAME', 'main')}`",
                      "fields": [
                          {"name": "📦 Node.js Dependencies (pnpm audit)", "value": node_text, "inline": False},
                          {"name": "🐍 Python ML Dependencies (pip-audit)", "value": py_text, "inline": False},
                          {"name": "⛓️ Smart Contracts (Slither)", "value": bc_text, "inline": False}
                      ],
                      "footer": {
                          "text": "RekaKarbon Security CI/CD • Automated Daily Audit"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions-Security-Notifier'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord response code: {resp.status}")
          except Exception as e:
              print(f"Failed to post to Discord: {e}")
          EOF

      - name: Send Notification to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ steps.consolidate.outputs.overall_title }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NODE_STATUS: ${{ steps.consolidate.outputs.node_status }}
          NODE_SUMMARY: ${{ steps.consolidate.outputs.node_summary }}
          PY_STATUS: ${{ steps.consolidate.outputs.py_status }}
          PY_SUMMARY: ${{ steps.consolidate.outputs.py_summary }}
          BC_STATUS: ${{ steps.consolidate.outputs.bc_status }}
          BC_SUMMARY: ${{ steps.consolidate.outputs.bc_summary }}
        run: |
          echo "Sending notification to Telegram..."
          python3 - << 'EOF'
          import json, os, urllib.request, urllib.parse

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          title = os.environ["TITLE"]
          run_url = os.environ["RUN_URL"]

          def status_badge(status):
              if status == "clean":
                  return "✅ <b>Clean</b>"
              elif status == "issues_detected":
                  return "🚨 <b>Vulnerabilities Found</b>"
              return "⚠️ <b>Incomplete / Failed</b>"

          repo = os.environ.get('GITHUB_REPOSITORY', 'RekaKarbon')
          ref = os.environ.get('GITHUB_REF_NAME', 'main')

          message = (
              f"<b>{title}</b>\n\n"
              f"📂 <b>Repository:</b> <code>{repo}</code>\n"
              f"🌿 <b>Branch:</b> <code>{ref}</code>\n"
              f"🔗 <a href='{run_url}'>View Workflow Run</a>\n\n"
              f"📦 <b>Node.js (pnpm audit):</b>\n{status_badge(os.environ['NODE_STATUS'])}\n<i>{os.environ['NODE_SUMMARY']}</i>\n\n"
              f"🐍 <b>Python ML (pip-audit):</b>\n{status_badge(os.environ['PY_STATUS'])}\n<i>{os.environ['PY_SUMMARY']}</i>\n\n"
              f"⛓️ <b>Blockchain (Slither):</b>\n{status_badge(os.environ['BC_STATUS'])}\n<i>{os.environ['BC_SUMMARY']}</i>"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Telegram response code: {resp.status}")
          except Exception as e:
              print(f"Failed to post to Telegram: {e}")
          EOF
