name: Dependency Security Audit

on:
  schedule:
    # 05:00 AM Jakarta Time (WIB, UTC+7) = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      audit_level:
        description: 'Audit severity threshold for pnpm'
        required: true
        default: 'high'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

permissions:
  contents: read

jobs:
  audit-node:
    name: Audit Node.js Workspace Dependencies
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.pnpm_audit.outputs.status }}
      summary: ${{ steps.pnpm_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Run pnpm audit (Production & Dev)
        id: pnpm_audit
        continue-on-error: true
        run: |
          AUDIT_LEVEL="${{ inputs.audit_level || 'high' }}"
          echo "Running pnpm audit with audit-level: $AUDIT_LEVEL"
          pnpm audit --audit-level "$AUDIT_LEVEL" --ignore-unfixable > pnpm-audit-report.txt 2>&1 || true
          pnpm audit --json --ignore-unfixable > pnpm-audit.json 2>/dev/null || true
          python3 scripts/actions/audit/format_node_summary.py "$AUDIT_LEVEL" pnpm-audit.json
          cat pnpm-audit-report.txt

      - name: Publish Step Summary
        run: |
          echo "## 🛡️ pnpm Security Audit Report (Severity >= ${{ inputs.audit_level || 'high' }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat pnpm-audit-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Node Audit Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: node-audit-report
          path: pnpm-audit-report.txt
          retention-days: 7

  audit-python:
    name: Audit Python ML Dependencies
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.pip_audit.outputs.status }}
      summary: ${{ steps.pip_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install ML dependencies (including dev / pip-audit)
        working-directory: ./ml
        run: poetry install --no-interaction

      - name: Run pip-audit on ML project
        id: pip_audit
        working-directory: ./ml
        continue-on-error: true
        run: |
          poetry run pip-audit --skip-editable > ml-audit-report.txt 2>&1 || true
          poetry run pip-audit --format json --skip-editable > ml-audit.json 2>/dev/null || true
          python3 ../scripts/actions/audit/format_python_summary.py ml-audit.json
          cat ml-audit-report.txt

      - name: Publish ML Step Summary
        working-directory: ./ml
        run: |
          echo "## 🐍 Python ML Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat ml-audit-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Python ML Audit Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ml-audit-report
          path: ml/ml-audit-report.txt
          retention-days: 7

  audit-blockchain:
    name: Audit Blockchain & Smart Contracts
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.slither_audit.outputs.status }}
      summary: ${{ steps.slither_audit.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile smart contracts
        run: pnpm blockchain:compile

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Slither Analyzer & solc-select
        run: pip install slither-analyzer solc-select

      - name: Run Slither Security Analysis
        id: slither_audit
        working-directory: ./blockchain
        continue-on-error: true
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24
          slither . --config-file slither.config.json > slither-report.txt 2>&1 || true
          python3 ../scripts/actions/audit/format_slither_summary.py slither-report.txt
          cat slither-report.txt

      - name: Publish Blockchain Step Summary
        working-directory: ./blockchain
        run: |
          echo "## ⛓️ Smart Contract Static Security Audit (Slither)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat slither-report.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Blockchain Audit Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blockchain-audit-report
          path: blockchain/slither-report.txt
          retention-days: 7

  notify-audit:
    name: Forward Security Audit Results
    runs-on: ubuntu-latest
    needs: [audit-node, audit-python, audit-blockchain]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Dispatch Notifications (Discord & Telegram)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NODE_STATUS: ${{ needs.audit-node.outputs.status || 'unknown' }}
          NODE_SUMMARY: ${{ needs.audit-node.outputs.summary || 'Node audit did not complete successfully.' }}
          PY_STATUS: ${{ needs.audit-python.outputs.status || 'unknown' }}
          PY_SUMMARY: ${{ needs.audit-python.outputs.summary || 'Python audit did not complete successfully.' }}
          BC_STATUS: ${{ needs.audit-blockchain.outputs.status || 'unknown' }}
          BC_SUMMARY: ${{ needs.audit-blockchain.outputs.summary || 'Blockchain audit did not complete successfully.' }}
        run: |
          PYTHONPATH=scripts/actions/ci_notifier/src python3 -m ci_notifier.cli
