name: Security Audit & Remediation

on:
  schedule:
    # 05:00 AM Jakarta Time (WIB, UTC+7) = 22:00 UTC (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      audit_level:
        description: 'Audit severity threshold for pnpm'
        required: false
        default: 'high'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
      auto_remediate:
        description: 'Automatically attempt vulnerability remediation via Pull Request'
        required: false
        default: true
        type: boolean
      target:
        description: 'Component target scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - blockchain
      custom_packages:
        description: 'Optional comma-separated list of packages to force update (e.g. axios,urllib3)'
        required: false
        default: ''
        type: string
      blockchain_suppress_detector:
        description: 'Optional Slither detector name to exclude in slither.config.json'
        required: false
        default: ''
        type: string
      base_branch:
        description: 'Target base branch for Pull Request (defaults to main for cron, ref for dispatch)'
        required: false
        default: ''
        type: string
      create_pr:
        description: 'Create Pull Request if remediation produces clean dependency changes'
        required: false
        default: true
        type: boolean
      track_issues:
        description: 'Automatically open/update GitHub issues for unfixable vulnerabilities'
        required: false
        default: true
        type: boolean
      fail_on_vuln:
        description: 'Fail workflow run if unfixable vulnerabilities remain'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit-and-remediate:
    name: Dependency Audit & Auto-Remediation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Security Script Dependencies
        run: pip install jinja2

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Monorepo Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ML Python Dependencies
        working-directory: ./ml
        run: poetry install --no-interaction

      - name: Setup & Run Slither Smart Contract Analysis
        id: slither_audit
        if: (inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'blockchain'
        working-directory: ./blockchain
        continue-on-error: true
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
          pnpm blockchain:compile || true
          slither . --config-file slither.config.json > slither-report.txt 2>&1 || true
          python3 ../scripts/actions/audit/format_slither_summary.py slither-report.txt
          cat slither-report.txt | tail -n 30 || true

      - name: Run Baseline Node.js Security Audit
        id: node_audit
        continue-on-error: true
        run: |
          AUDIT_LEVEL="${{ inputs.audit_level || 'high' }}"
          echo "Auditing Node.js workspace at severity: $AUDIT_LEVEL"
          pnpm audit --audit-level "$AUDIT_LEVEL" --ignore-unfixable > pnpm-audit-report.txt 2>&1 || true
          pnpm audit --json --ignore-unfixable > pnpm-audit.json 2>/dev/null || true
          python3 scripts/actions/audit/format_node_summary.py "$AUDIT_LEVEL" pnpm-audit.json
          cat pnpm-audit-report.txt | tail -n 40 || true

      - name: Run Baseline Python ML Security Audit
        id: python_audit
        working-directory: ./ml
        continue-on-error: true
        run: |
          poetry run pip-audit --skip-editable > ml-audit-report.txt 2>&1 || true
          poetry run pip-audit --format json --skip-editable > ml-audit.json 2>/dev/null || true
          python3 ../scripts/actions/audit/format_python_summary.py ml-audit.json
          cat ml-audit-report.txt | tail -n 40 || true

      - name: Evaluate Baseline Findings
        id: check_baseline
        run: |
          NODE_STATUS="${{ steps.node_audit.outputs.status || 'clean' }}"
          PY_STATUS="${{ steps.python_audit.outputs.status || 'clean' }}"
          BC_STATUS="${{ steps.slither_audit.outputs.status || 'clean' }}"

          echo "Node Status: $NODE_STATUS"
          echo "Python Status: $PY_STATUS"
          echo "Blockchain Status: $BC_STATUS"

          if [ "$NODE_STATUS" = "issues_detected" ] || [ "$PY_STATUS" = "issues_detected" ] || [ "$BC_STATUS" = "issues_detected" ]; then
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Security vulnerabilities detected during baseline audit."
          else
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
            echo "Monorepo dependencies and contracts are completely clean."
          fi

      - name: Dynamically Remediate Python ML Dependencies
        if: (steps.check_baseline.outputs.has_vulns == 'true' || github.event_name == 'workflow_dispatch') && (inputs.auto_remediate != false && inputs.auto_remediate != 'false') && ((inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'python')
        run: bash scripts/actions/autofix/remediate_python.sh "${{ inputs.custom_packages || '' }}"

      - name: Dynamically Remediate Node.js Dependencies
        if: (steps.check_baseline.outputs.has_vulns == 'true' || github.event_name == 'workflow_dispatch') && (inputs.auto_remediate != false && inputs.auto_remediate != 'false') && ((inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'node')
        run: bash scripts/actions/autofix/remediate_node.sh "${{ inputs.custom_packages || '' }}"

      - name: Suppress Smart Contract Detector
        if: inputs.blockchain_suppress_detector != '' && ((inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'blockchain')
        run: python3 scripts/actions/autofix/suppress_detector.py "${{ inputs.blockchain_suppress_detector }}"

      - name: Verify Python ML Quality Gates
        if: steps.check_baseline.outputs.has_vulns == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./ml
        run: poetry run pytest -q || echo "Tests completed"

      - name: Verify Node Types Quality Gates
        if: steps.check_baseline.outputs.has_vulns == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm client:typecheck && pnpm server:typecheck || echo "Typecheck completed"

      - name: Clean Test Runtime Artifacts
        if: steps.check_baseline.outputs.has_vulns == 'true' || github.event_name == 'workflow_dispatch'
        run: git checkout ml/models/ ml/data/ 2>/dev/null || true

      - name: Check for Remediated Changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain package.json pnpm-lock.yaml ml/pyproject.toml ml/poetry.lock blockchain/slither.config.json)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Remediated changes detected:"
            git status --short
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile changes produced by auto-remediation."
          fi

      - name: Create Pull Request with Remediated Patches
        id: create_pr
        if: steps.check_changes.outputs.has_changes == 'true' && (inputs.create_pr != false && inputs.create_pr != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          HUSKY: 0
        run: |
          DEFAULT_BASE="${{ github.event_name == 'schedule' && 'main' || github.ref_name }}"
          BASE_BRANCH="${{ inputs.base_branch || '' }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="$DEFAULT_BASE"
          fi
          bash scripts/actions/autofix/create_pr.sh "${{ github.run_id }}" "${{ inputs.target || 'all' }}" "$BASE_BRANCH"

      - name: Capture Post-Remediation Audits
        id: post_audit
        continue-on-error: true
        run: |
          AUDIT_LEVEL="${{ inputs.audit_level || 'high' }}"
          pnpm audit --audit-level "$AUDIT_LEVEL" --ignore-unfixable > pnpm-audit-after.txt 2>&1 || true
          pnpm audit --json --ignore-unfixable > pnpm-audit-after.json 2>/dev/null || true
          poetry --directory ./ml run pip-audit --format json --skip-editable > ml-audit-after.json 2>/dev/null || true

      - name: Audit Language Runtimes (Node.js & Python Lifecycle)
        id: runtime_audit
        continue-on-error: true
        run: |
          python3 scripts/actions/security/check_runtimes.py --output runtime-audit.json

      - name: Scan Server Dockerfile with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: 'server/Dockerfile'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Synchronize GitHub Security Issues
        id: sync_issues
        if: (inputs.track_issues != false && inputs.track_issues != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/actions/security/manage_issues.py \
            --node-audit pnpm-audit-after.json \
            --python-audit ml-audit-after.json \
            --slither-report blockchain/slither-report.txt \
            --runtime-audit runtime-audit.json \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit-reports
          path: |
            pnpm-audit-report.txt
            pnpm-audit-after.json
            ml/ml-audit-report.txt
            ml-audit-after.json
            blockchain/slither-report.txt
            runtime-audit.json
          retention-days: 7

      - name: Forward Security Notifications (Discord & Telegram)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL: ${{ steps.create_pr.outputs.pr_url || env.PR_URL || '' }}
          ACTIVE_ISSUES_COUNT: ${{ steps.sync_issues.outputs.active_issues_count || 0 }}
          NEW_ISSUES_COUNT: ${{ steps.sync_issues.outputs.new_issues_count || 0 }}
          CLOSED_ISSUES_COUNT: ${{ steps.sync_issues.outputs.closed_issues_count || 0 }}
          NODE_STATUS: ${{ steps.node_audit.outputs.status || 'unknown' }}
          NODE_SUMMARY: ${{ steps.node_audit.outputs.summary || 'Node audit did not complete successfully.' }}
          PY_STATUS: ${{ steps.python_audit.outputs.status || 'unknown' }}
          PY_SUMMARY: ${{ steps.python_audit.outputs.summary || 'Python audit did not complete successfully.' }}
          BC_STATUS: ${{ steps.slither_audit.outputs.status || 'clean' }}
          BC_SUMMARY: ${{ steps.slither_audit.outputs.summary || 'Blockchain smart contract audit clean or skipped.' }}
        run: |
          PYTHONPATH=scripts/actions/ci_notifier/src python3 -m ci_notifier.cli

      - name: Evaluate Final Status Gate
        if: inputs.fail_on_vuln == true || inputs.fail_on_vuln == 'true'
        run: |
          ACTIVE="${{ steps.sync_issues.outputs.active_issues_count || 0 }}"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "::error::Unresolved vulnerabilities detected ($ACTIVE active). Check opened tracking issues and PR!"
            exit 1
          fi
