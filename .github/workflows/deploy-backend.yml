name: Deploy NestJS Backend to Host (Bare-Metal / PM2)

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run database seeder after deploy'
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm server:lint

      - name: Typechecking server
        run: pnpm server:typecheck

      - name: Test server
        run: pnpm server:test

  deploy:
    name: Deploy via SSH (Bare-Metal)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write production .env to host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          script: |
            mkdir -p $HOME/RekaKarbon-Backend/server
            cat > $HOME/RekaKarbon-Backend/server/.env << 'ENVEOF'
            ${{ secrets.BACKEND_ENV }}
            ENVEOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            PROJECT_DIR="$HOME/RekaKarbon-Backend"

            # 1. Pull latest code from main
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # 2. Install and use the Node.js version specified by .nvmrc
            nvm install
            nvm use

            echo "Node.js: $(node --version)"
            echo "npm: $(npm --version)"
            echo "pnpm: $(pnpm --version)"

            # 3. Download and install pnpm
            corepack enable pnpm
            echo "pnpm: $(pnpm --version)"

            # 4. Install all dependencies (dev tools needed for build step)
            pnpm install --frozen-lockfile

            # 5. Compile TypeScript → dist/
            pnpm server:build

            # 6. Run any pending database migrations (safe no-op if up to date)
            pnpm --filter ./server prisma:migrate:deploy

            # 7. Restarting application with systemd Linux
            echo "Restarting application..."
            sudo systemctl restart rekakarbon-backend


            # 8. Health check — allow the process a moment to fully start
            sleep 10

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8006/health || true)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Backend health check failed (HTTP $HTTP_STATUS)"
              echo "Systemd status:"
              sudo systemctl status rekakarbon-backend --no-pager || true

              echo "Recent logs:"
              sudo journalctl -u rekakarbon-backend -n 50 --no-pager || true

              exit 1
            fi

            echo "Backend health check passed (HTTP $HTTP_STATUS)"

            # 9. Optional database seeder
            if [ "$RUN_SEED" = "true" ]; then
              echo "Workflow requested — running database seeder..."
              pnpm db:seed
            else
              echo "Skipping database seeder."
            fi

            echo "Deployment completed successfully!"
        env:
          RUN_SEED: ${{ inputs.run_seed }}
