name: Deploy NestJS Backend to Host (Bare-Metal)

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Bypass test, lint, and typecheck jobs'
        required: true
        default: false
        type: boolean
      run_seed:
        description: 'Run database seeder after deploy'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Test Backend
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm server:lint

      - name: Typecheck server
        run: pnpm server:typecheck

      - name: Test server
        run: pnpm server:test

      - name: Audit production dependencies (high)
        run: pnpm audit --prod --audit-level high

  build:
    name: Build Artifact
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_bundle.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build server code
        run: pnpm server:build

      - name: Create release bundle directory
        id: create_bundle
        run: |
          RELEASE_ID="$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

          mkdir -p bundle/server

          cp .nvmrc bundle/
          cp package.json bundle/
          cp pnpm-lock.yaml bundle/
          cp pnpm-workspace.yaml bundle/ 2>/dev/null || true

          cp server/package.json bundle/server/
          cp server/prisma.config.ts bundle/server/
          cp server/nginx.conf bundle/server/ 2>/dev/null || true
          cp -r server/dist bundle/server/dist
          cp -r server/prisma bundle/server/prisma
          mkdir -p bundle/server/src
          cp -r server/src/storage bundle/server/src/storage 2>/dev/null || true

          mkdir -p bundle/ml/models bundle/ml/src bundle/ml/data
          cp -r ml/models/* bundle/ml/models/ 2>/dev/null || true
          cp -r ml/src/* bundle/ml/src/ 2>/dev/null || true
          cp -r ml/data/* bundle/ml/data/ 2>/dev/null || true
          cp ml/pyproject.toml bundle/ml/ 2>/dev/null || true
          cp ml/poetry.lock bundle/ml/ 2>/dev/null || true

          tar -czf "rekakarbon-backend-${RELEASE_ID}.tar.gz" -C bundle .

      - name: Upload artifact archive
        uses: actions/upload-artifact@v7
        with:
          name: backend-release-${{ env.RELEASE_ID }}
          path: rekakarbon-backend-${{ env.RELEASE_ID }}.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Target Server
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Release ID
        run: |
          RELEASE_ID="${{ needs.build.outputs.release_id }}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-release-${{ env.RELEASE_ID }}

      - name: Upload artifact via SCP to target server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          source: 'rekakarbon-backend-${{ env.RELEASE_ID }}.tar.gz'
          target: '/tmp'

      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          RUN_SEED: ${{ inputs.run_seed }}
          BACKEND_PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          BACKEND_SSH_PASSWORD: ${{ secrets.BACKEND_SSH_PASSWORD }}
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          envs: RUN_SEED,BACKEND_PROJECT_DIR,RELEASE_ID,BACKEND_ENV,BACKEND_SSH_PASSWORD
          script_stop: true
          script_path: scripts/deploy/backend_deploy.sh
