name: Deploy NestJS Backend to Host (Bare-Metal / PM2)

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run database seeder after deploy'
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm server:lint

      - name: Typechecking server
        run: pnpm server:typecheck

      - name: Test server
        run: pnpm server:test

  deploy:
    name: Deploy via SSH (Bare-Metal)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write production .env to host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          script: |
            mkdir -p $HOME/RekaKarbon-Backend/server
            cat > $HOME/RekaKarbon-Backend/server/.env << 'ENVEOF'
            ${{ secrets.BACKEND_ENV }}
            ENVEOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            PROJECT_DIR="$HOME/RekaKarbon-Backend"

            # 1. Pull latest code from main
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # 2. Install all dependencies (dev tools needed for build step)
            pnpm install --frozen-lockfile

            # 3. Compile TypeScript → dist/
            pnpm server:build

            # 4. Run any pending database migrations (safe no-op if up to date)
            pnpm --filter ./server prisma:migrate:deploy

            # 5. Reload PM2 with zero downtime, or start fresh if first deploy
            if pm2 describe rekakarbon-backend > /dev/null 2>&1; then
              echo "PM2 process found — performing zero-downtime reload..."
              pm2 reload rekakarbon-backend --update-env
            else
              echo "No PM2 process found — starting for the first time..."
              pm2 start ecosystem.config.cjs --env production
              pm2 save
            fi

            # 6. Health check — allow the process a moment to fully start
            sleep 5
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8006/health || true)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Backend health check failed (HTTP $HTTP_STATUS) — dumping logs..."
              pm2 logs rekakarbon-backend --lines 30 --nostream
              exit 1
            fi
            echo "Backend health check passed (HTTP $HTTP_STATUS)"

            # 7. Optional database seeder
            if [ "$RUN_SEED" = "true" ]; then
              echo "Workflow requested — running database seeder..."
              pnpm db:seed
            else
              echo "Skipping database seeder."
            fi

            echo "Deployment completed successfully!"
        env:
          RUN_SEED: ${{ inputs.run_seed }}
