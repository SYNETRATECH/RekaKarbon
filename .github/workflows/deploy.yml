name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy-to-server:
    # Hanya berjalan jika CI (Testing) berhasil
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    - name: 🔐 Connect to Tailscale Network
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        tags: tag:ci

    - name: 🚚 Transfer Files via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        # Memindahkakan seluruh file dari GitHub ke server folder ~/VM_BLOCKHAIN
        source: "."
        target: "~/VM_BLOCKHAIN"
        strip_components: 0
        
    - name: 🚀 Execute Deployment on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        command_timeout: 10m
        script: |
          set -e
          
          echo "=== Membersihkan kontainer lama (jika ada) ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker rm -f besu-dev-node 2>/dev/null || true
          
          echo "=== Menjalankan Docker Hyperledger Besu ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker run -d \
            --name besu-dev-node \
            --restart always \
            -p 8545:8545 \
            -p 8546:8546 \
            -v besu_data:/opt/besu/data \
            hyperledger/besu:latest \
            --network=dev \
            --rpc-http-enabled=true \
            --rpc-http-host=0.0.0.0 \
            --rpc-http-cors-origins="*" \
            --rpc-http-api=ETH,NET,WEB3,DEBUG,MINER,TXPOOL \
            --rpc-ws-enabled=true \
            --rpc-ws-host=0.0.0.0 \
            --host-allowlist="*" \
            --miner-enabled=true \
            --miner-coinbase=0x627306090abaB3A6e1400e9345bC60c78a8BEf57
          
          echo "=== Menunggu Node Besu siap (15 detik) ==="
          sleep 15
          
          echo "=== Menginstall dependensi & Deploy Smart Contract ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker run --rm \
            -v ~/VM_BLOCKHAIN:/app \
            -w /app \
            --network host \
            node:20 \
            bash -c "npm ci && npx hardhat run scripts/deploy.js --network besu_local"
          
          echo "✅ DEPLOYMENT SERVER SELESAI!"
