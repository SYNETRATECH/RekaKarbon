name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy-to-server:
    # Hanya berjalan jika CI (Testing) berhasil
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    - name: 🔐 Connect to Tailscale Network
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        tags: tag:ci

    - name: 🚚 Transfer Files via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        # Memindahkakan seluruh file dari GitHub ke server folder ~/VM_BLOCKHAIN
        source: "."
        target: "~/VM_BLOCKHAIN"
        strip_components: 0
        
    - name: 🚀 Execute Deployment on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        command_timeout: 10m
        script: |
          set -e
          
          echo "=== Membersihkan kontainer & data lama (jika ada) ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker rm -f besu-dev-node 2>/dev/null || true
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker volume rm besu_data 2>/dev/null || true
          
          echo "=== Menjalankan Docker Hyperledger Besu ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker run -d \
            --name besu-dev-node \
            --restart always \
            -p 8545:8545 \
            -p 8546:8546 \
            hyperledger/besu:23.4.4 \
            --network=dev \
            --rpc-http-enabled=true \
            --rpc-http-host=0.0.0.0 \
            --rpc-http-cors-origins="*" \
            --rpc-http-api=ETH,NET,WEB3,DEBUG,MINER,TXPOOL \
            --rpc-ws-enabled=true \
            --rpc-ws-host=0.0.0.0 \
            --host-allowlist="*"
          
          echo "=== Menunggu Node Besu siap (max 60 detik) ==="
          for i in $(seq 1 12); do
            if curl -s -X POST --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' http://127.0.0.1:8545 > /dev/null 2>&1; then
              echo "✅ Node Besu sudah merespon pada percobaan ke-$i!"
              break
            fi
            echo "Percobaan ke-$i: Besu belum siap, menunggu 5 detik..."
            sleep 5
            if [ $i -eq 12 ]; then
              echo "❌ Besu gagal menyala setelah 60 detik. Menampilkan log:"
              echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker logs --tail 30 besu-dev-node
              exit 1
            fi
          done
          
          echo "=== Menginstall dependensi & Deploy Smart Contract ==="
          echo ${{ secrets.SERVER_PASSWORD }} | sudo -S docker run --rm \
            -v ~/VM_BLOCKHAIN:/app \
            -w /app \
            --network host \
            node:20 \
            bash -c "npm ci && npx hardhat run scripts/deploy.js --network besu_local"
          
          echo "✅ DEPLOYMENT SERVER SELESAI!"
